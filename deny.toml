[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
    { crate = "getrandom@0.2", reason = "ring 0.17 depends on getrandom 0.2" },
    { crate = "windows-sys@0.52", reason = "ring 0.17 depends on windows-sys 0.52" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
