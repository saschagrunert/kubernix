version = 4
root = "{root}"
state = "{state}"

[plugins."io.containerd.server.v1.grpc"]
address = "{socket}"

[plugins."io.containerd.server.v1.ttrpc"]
address = "{socket}.ttrpc"

[plugins."io.containerd.cri.v1.images"]
snapshotter = "{snapshotter}"

[plugins."io.containerd.cri.v1.images".pinned_images]
sandbox = "registry.k8s.io/pause:3.10.2"

[plugins."io.containerd.cri.v1.images".registry]
config_path = "{certs_dir}"

[plugins."io.containerd.cri.v1.runtime"]
enable_unprivileged_ports = true
enable_unprivileged_icmp = true
disable_apparmor = {rootless}
restrict_oom_score_adj = {rootless}
cdi_spec_dirs = ["{cdi_spec_dir}"]

[plugins."io.containerd.cri.v1.runtime".cni]
bin_dirs = ["{plugin_dir}"]
conf_dir = "{cni_conf_dir}"

[plugins."io.containerd.cri.v1.runtime".containerd]
default_runtime_name = "{default_runtime}"

{runtimes}
[plugins."io.containerd.nri.v1.nri"]
disable = true
