# The CRI-O configuration file specifies all of the available configuration
# options and command-line flags for the crio(8) OCI Kubernetes Container Runtime
# daemon, but in a TOML format that can be more easily modified and versioned.
#
# Please refer to crio.conf(5) for details of all configuration options.

# CRI-O supports partial configuration reload during runtime, which can be
# done by sending SIGHUP to the running process. Currently supported options
# are explicitly mentioned with: 'This option supports live configuration
# reload'.

# KuberNix passes this file as the only drop-in of --config-dir and an empty
# main configuration (--config=/dev/null), so that the CRI-O configuration of
# the host does not apply. CRI-O reads its storage defaults from the
# containers-storage.conf(5) file of the node directory (CONTAINERS_STORAGE_CONF)
# instead of the one of the host. All paths CRI-O writes to are unique per node,
# except for the CNI result cache in /var/lib/cni and the blob info cache in
# /var/lib/containers/cache, which CRI-O does not allow to configure. Their
# entries belong to single containers and layers, so the nodes do not interfere.
[crio]

# Path to the "root directory". CRI-O stores all of its data, including
# containers images, in this directory.
root = "{containers_root}"

# Path to the "run directory". CRI-O stores all of its state in this directory.
runroot = "{containers_runroot}"

# Storage driver used to manage the storage of images and containers. Please
# refer to containers-storage.conf(5) to see all available storage drivers.
storage_driver = "{storage_driver}"

# List to pass options to the storage driver. Please refer to
# containers-storage.conf(5) to see all available storage options.
storage_option = [{storage_option}]

# The default log directory where all logs will go unless directly specified by
# the kubelet. The log directory specified must be an absolute directory.
log_dir = "{log_dir}"

# Location for CRI-O to lay down the temporary version file. It is located on
# the tmpfs of /run, so that CRI-O removes the containers after a reboot.
version_file = "{version_file}"

# Location for CRI-O to lay down the clean shutdown file. If it is missing on
# startup, CRI-O checks the storage directory for corruption.
clean_shutdown_file = "{clean_shutdown_file}"

# The crio.api table contains settings for the kubelet/gRPC interface.
[crio.api]

# Path to AF_LOCAL socket on which CRI-O will listen.
listen = "{listen}"

# IP address on which the stream server will listen.
stream_address = "127.0.0.1"

# The port on which the stream server will listen. If the port is set to "0", then
# CRI-O will allocate a random free port number.
stream_port = "0"

# Enable encrypted TLS transport of the stream server.
stream_enable_tls = false

# Path to the x509 certificate file used to serve the encrypted stream. This
# file can change, and CRI-O will automatically pick up the changes within 5
# minutes.
stream_tls_cert = ""

# Path to the key file used to serve the encrypted stream. This file can
# change and CRI-O will automatically pick up the changes within 5 minutes.
stream_tls_key = ""

# Path to the x509 CA(s) file used to verify and authenticate client
# communication with the encrypted stream. This file can change and CRI-O will
# automatically pick up the changes within 5 minutes.
stream_tls_ca = ""

# Maximum grpc send message size in bytes. If not set or <=0, then CRI-O will default to 16 * 1024 * 1024.
grpc_max_send_msg_size = 16777216

# Maximum grpc receive message size. If not set or <= 0, then CRI-O will default to 16 * 1024 * 1024.
grpc_max_recv_msg_size = 16777216

# The crio.runtime table contains settings pertaining to the OCI runtime used
# and options for how to set up and manage the OCI runtime.
[crio.runtime]

# A list of ulimits to be set in containers by default, specified as
# "<ulimit name>=<soft limit>:<hard limit>", for example:
# "nofile=1024:2048"
# If nothing is set here, settings will be inherited from the CRI-O daemon
#default_ulimits = [
#]

# default_runtime is the _name_ of the OCI runtime to be used as the default.
# The name is matched against the runtimes map below.
default_runtime = "{default_runtime}"

# If true, the runtime will not use pivot_root, but instead use MS_MOVE.
no_pivot = false

# decryption_keys_path is the path where the keys required for
# image decryption are stored. This option supports live configuration reload.
decryption_keys_path = "{decryption_keys_path}"

# If true, SELinux will be used for pod separation on the host.
selinux = false

# Path to the seccomp.json profile which is used as the default seccomp profile
# for the runtime. If not specified, then the internal default seccomp profile
# will be used. This option supports live configuration reload.
seccomp_profile = ""

# Used to change the name of the default AppArmor profile of CRI-O. The default
# profile name is "crio-default". This profile only takes effect if the user
# does not specify a profile via the Kubernetes Pod's metadata annotation. If
# the profile is set to "unconfined", then this equals to disabling AppArmor.
# This option supports live configuration reload.
apparmor_profile = "crio-default"

# Cgroup management implementation used for the runtime.
cgroup_manager = "cgroupfs"

# The irqbalance service config file, which CRI-O changes for pods which
# disable the IRQ load balancing, and the file to restore it from on startup.
irqbalance_config_file = "{irqbalance_config_file}"
irqbalance_config_restore_file = "disable"

# List of default capabilities for containers. If it is empty or commented out,
# only the capabilities defined in the containers json file by the user/kube
# will be added. The list matches the default of containerd, so that workloads
# behave the same with both CRI runtimes.
default_capabilities = [
    "CHOWN",
    "DAC_OVERRIDE",
    "FSETID",
    "FOWNER",
    "MKNOD",
    "NET_RAW",
    "SETGID",
    "SETUID",
    "SETFCAP",
    "SETPCAP",
    "NET_BIND_SERVICE",
    "SYS_CHROOT",
    "KILL",
    "AUDIT_WRITE",
]

# List of default sysctls. If it is empty or commented out, only the sysctls
# defined in the container json file by the user/kube will be added. Like
# containerd, they allow binding privileged ports and, outside of a user
# namespace, ICMP echo sockets for all users. CRI-O skips them for pods in the
# host network.
default_sysctls = [{default_sysctls}]

# List of additional devices. specified as
# "<device-on-host>:<device-on-container>:<permissions>", for example: "--device=/dev/sdc:/dev/xvdc:rwm".
#If it is empty or commented out, only the devices
# defined in the container json file by the user/kube will be added.
additional_devices = [
]

# List of directories to scan for CDI Spec files. The directory of the node is
# empty, so that the CDI specs of the host (/etc/cdi, /var/run/cdi) do not apply.
cdi_spec_dirs = [
    "{cdi_spec_dir}",
]

# Path to OCI hooks directories for automatically executed hooks. If one of the
# directories does not exist, then CRI-O will automatically skip them.
hooks_dir = [
    "{hooks_dir}",
]

# Path to the file specifying the defaults mounts for each container. The
# format of the config is /SRC:/DST, one mount per line. If it is not set,
# CRI-O reads the mounts files of the host in /etc/containers and
# /usr/share/containers instead. A missing file adds no mounts.
default_mounts_file = "{default_mounts_file}"

# Whether container output should be logged to journald in addition to the kuberentes log file
log_to_journald = false

# Path to directory in which container exit files are written to by conmon.
container_exits_dir = "{exits_dir}"

# Path to directory for container attach sockets. CRI-O creates it on startup
# and keeps the PID files of exec sessions in it. conmon-rs places the attach
# sockets of the pod runtime type in the container directory instead.
container_attach_socket_dir = "{attach_socket_dir}"

# The prefix to use for the source of the bind mounts.
bind_mount_prefix = ""

# If set to true, all containers will run in read-only mode.
read_only = false

# Changes the verbosity of the logs based on the level it is set to. Options
# are fatal, panic, error, warn, info, and debug. This option supports live
# configuration reload.
log_level = "info"

# Filter the log messages by the provided regular expression.
# This option supports live configuration reload.
log_filter = ""

# The minimal amount of time in seconds to wait before issuing a timeout
# regarding the proper termination of the container. The lowest possible
# value is 30s, whereas lower values are not considered by CRI-O.
ctr_stop_timeout = 30

# Keep the infra container of pods. With the pod runtime type, the conmon-rs
# instance of a pod is created for its infra container. CRI-O 1.37 replaces a
# dropped infra container by a placeholder without runtime handler, so the
# conmon-rs instance and all containers of the pod would use the default
# runtime handler instead of the one of their RuntimeClass. This is required
# until CRI-O passes the runtime handler to the placeholder. It costs one
# infra container per pod, and every node pulls the pause image.
drop_infra_ctr = false

# The directory where the state of the managed namespaces gets tracked.
namespaces_dir = "{namespaces_dir}"

# The "crio.runtime.runtimes" table defines a list of OCI compatible runtimes.
# The runtime to use is picked based on the runtime_handler provided by the CRI.
# If no runtime_handler is provided, the runtime will be picked based on the level
# of trust of the workload. Each entry in the table should follow the format:
#
#[crio.runtime.runtimes.runtime-handler]
#  runtime_path = "/path/to/the/executable"
#  runtime_type = "oci"
#  runtime_root = "/path/to/the/root"
#  monitor_path = "/path/to/container/monitor"
#
# Where:
# - runtime-handler: name used to identify the runtime
# - runtime_path (optional, string): absolute path to the runtime executable in
#   the host filesystem. If omitted, the runtime-handler identifier should match
#   the runtime executable name, and the runtime executable should be placed
#   in $PATH.
# - runtime_type (optional, string): type of runtime, one of: "oci", "vm" or
#   "pod". If omitted, an "oci" runtime is assumed. The "pod" type uses a
#   single conmon-rs instance per pod as container monitor.
# - runtime_root (optional, string): root directory for storage of containers
#   state.
# - monitor_path (optional, string): path of the container monitor (conmon or
#   conmon-rs) binary, which is searched for in $PATH if empty.
# - monitor_cgroup (optional, string): cgroup the container monitor process
#   will be put in.
# - monitor_env (optional, array of strings): environment variables to pass
#   to the container monitor.

{runtimes}

# Kata Containers is an OCI runtime, where containers are run inside lightweight
# VMs. Kata provides additional isolation towards the host, minimizing the host attack
# surface and mitigating the consequences of containers breakout.

# Kata Containers with the default configured VMM
#[crio.runtime.runtimes.kata-runtime]

# Kata Containers with the QEMU VMM
#[crio.runtime.runtimes.kata-qemu]

# Kata Containers with the Firecracker VMM
#[crio.runtime.runtimes.kata-fc]

# The crio.image table contains settings pertaining to the management of OCI images.
#
# CRI-O reads its registries configuration from the containers-registries.conf(5)
# file passed via --registries-conf, which resolves short image names, and
# ignores the drop-in files of the host via --registries-conf-dir. The registry
# certificates of the host (/etc/containers/certs.d, /etc/docker/certs.d) and
# its registry credentials still apply on purpose, so that private registries
# work like on the host.
[crio.image]

# Default transport for pulling images from a remote container storage.
default_transport = "docker://"

# The path to a file containing credentials necessary for pulling images from
# secure registries. The file is similar to that of /var/lib/kubelet/config.json
global_auth_file = ""

# The image used to instantiate infra containers.
# This option supports live configuration reload.
pause_image = "registry.k8s.io/pause:3.10.2"

# The path to a file containing credentials specific for pulling the pause_image from
# above. The file is similar to that of /var/lib/kubelet/config.json
# This option supports live configuration reload.
pause_image_auth_file = ""

# The command to run to have a container stay in the paused state.
# When explicitly set to "", it will fallback to the entrypoint and command
# specified in the pause image. When commented out, it will fallback to the
# default: "/pause". This option supports live configuration reload.
pause_command = "/pause"

# Path to the file which decides what sort of policy we use when deciding
# whether or not to trust an image that we've pulled. It is not recommended that
# this option be used, as the default behavior of using the system-wide default
# policy (i.e., /etc/containers/policy.json) is most often preferred. Please
# refer to containers-policy.json(5) for more details.
signature_policy = "{signature_policy}"

# Root path for pod namespace-separated signature policies, which take
# precedence over the signature_policy.
signature_policy_dir = "{signature_policy_dir}"

# The mode of short name resolution. Like containerd, CRI-O resolves short
# names via docker.io, the only unqualified-search registry, without
# prompting.
short_name_mode = "disabled"

# List of registries to skip TLS verification for pulling images. Please
# consider configuring the registries via /etc/containers/registries.conf before
# changing them here.
#insecure_registries = "[]"

# Temporary directory to use for storing big files, for example image layers
# during a pull. It defaults to /var/tmp of the host.
big_files_temporary_dir = "{big_files_temporary_dir}"

# Controls how image volumes are handled. The valid values are mkdir, bind and
# ignore; the latter will ignore volumes entirely.
image_volumes = "mkdir"

# The crio.network table containers settings pertaining to the management of
# CNI plugins.
[crio.network]

# The default CNI network name to be selected. If not set or "", then
# CRI-O will pick-up the first one found in network_dir.
# cni_default_network = ""

# Path to the directory where CNI configuration files are located.
network_dir = "{network_dir}"

# Paths to directories where CNI plugin binaries are located.
plugin_dirs = [ "{plugin_dir}" ]

# A necessary configuration for Prometheus based metrics retrieval
[crio.metrics]

# Globally enable or disable metrics support.
enable_metrics = false

# The port on which the metrics server will listen.
metrics_port = 9090

# NRI (Node Resource Interface) configuration. It is disabled unless
# --nri is set, and its socket and plugin directories belong to the node
# instead of the host.
[crio.nri]
enable_nri = {nri}
nri_listen = "{nri_listen}"
nri_plugin_dir = "{nri_plugin_dir}"
nri_plugin_config_dir = "{nri_plugin_config_dir}"
