name: ci
on:
  pull_request: {}
  push:
    tags:
      - "v*"
    branches:
      - main

# Jobs which need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single required check which gates releases and fails unless every other
  # check succeeded.
  all-checks:
    name: all checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - build-static
      - docs
      - lint-audit
      - lint-clippy
      - lint-deny
      - lint-dependencies
      - lint-generated
      - lint-markdown
      - lint-rustfmt
      - lint-shellcheck
      - lint-vex
      - test-integration
      - test-msrv
      - test-unit
    steps:
      - name: Check the results of all needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  build:
    name: build / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            make_target: build
            cache_suffix: ""
          - profile: release
            make_target: build-release
            cache_suffix: "-release"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo${{ matrix.cache_suffix }}-${{ hashFiles('**/Cargo.lock') }}
      - run: make ${{ matrix.make_target }}

  # Native builds on both architectures, since cargo auditable does not work
  # with cross. The embedded dependency list is the source of the release SBOMs.
  build-static:
    name: build / static / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-auditable@0.7.7
      # Release binaries get built from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - run: make build-static STATIC_TARGET=${{ matrix.target }} STATIC_CARGO="cargo auditable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernix-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/kubernix

  deploy:
    name: deploy / release
    runs-on: ubuntu-latest
    needs: all-checks
    if: startsWith(github.ref, 'refs/tags/v')
    # Protection rules like required reviewers can be added to this
    # environment in the repository settings.
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kubernix-*
          path: artifacts
      - name: Prepare release binaries
        run: |
          mkdir -p release
          for arch in x86_64 aarch64; do
            cp "artifacts/kubernix-$arch/kubernix" "release/kubernix-$arch"
          done
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0
      # The SBOMs list the dependencies embedded by cargo auditable, so only
      # what is linked into each binary. The SPDX version is pinned to keep the
      # attestation predicate type stable.
      - name: Generate SBOMs
        working-directory: release
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for arch in x86_64 aarch64; do
            "$SYFT" scan "file:kubernix-$arch" -o "spdx-json@2.3=kubernix-$arch.spdx.json"
            jq -e --arg purl "pkg:cargo/kubernix@${GITHUB_REF_NAME#v}" \
              'any(.packages[].externalRefs[]?; .referenceLocator | split("?")[0] | split("#")[0] == $purl)' \
              "kubernix-$arch.spdx.json" >/dev/null
          done
      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum kubernix-x86_64 kubernix-aarch64 \
            kubernix-x86_64.spdx.json kubernix-aarch64.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # SHA256SUMS covers all other assets, so a single signature is enough.
      - name: Sign checksums
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/kubernix-x86_64
            release/kubernix-aarch64
            release/kubernix-x86_64.spdx.json
            release/kubernix-aarch64.spdx.json
            release/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/kubernix-x86_64
          sbom-path: release/kubernix-x86_64.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/kubernix-aarch64
          sbom-path: release/kubernix-aarch64.spdx.json
      - name: Upload release binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*

  docs:
    name: docs / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - run: make docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: target/doc

  docs-publish:
    name: docs / publish
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: doc
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc

  lint-clippy:
    name: lint / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: make lint-clippy

  lint-rustfmt:
    name: lint / rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: make lint-rustfmt

  lint-audit:
    name: lint / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - run: make lint-audit

  lint-deny:
    name: lint / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  lint-dependencies:
    name: lint / dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-dependencies

  # Regenerates the README versions table and formats the files via prettier
  # from the nixpkgs of flake.lock. The nixpkgs bumps of dependabot do neither,
  # so the changes get committed to their pull requests instead.
  lint-generated:
    name: lint / readme versions and formatting
    runs-on: ubuntu-latest
    env:
      COMMIT_CHANGES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/nix/') }}
    permissions:
      contents: write
    steps:
      # A rerun after the merge finds the branch deleted. Its files got
      # checked or updated before, so there is nothing left to do.
      - name: Resolve the branch to update
        id: branch
        if: env.COMMIT_CHANGES == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rc=0
          git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/heads/$HEAD_REF" >/dev/null || rc=$?
          case $rc in
            0) echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "::notice::Branch $HEAD_REF no longer exists, skipping the check"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.skip != 'true'
        with:
          ref: ${{ steps.branch.outputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.branch.outputs.skip != 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: steps.branch.outputs.skip != 'true'
      - if: steps.branch.outputs.skip != 'true'
        run: make update-readme
      - if: steps.branch.outputs.skip != 'true'
        run: nix shell --inputs-from . nixpkgs#prettier -c prettier --write .
      - if: env.COMMIT_CHANGES == 'true' && steps.branch.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Update the README versions and formatting"
            git push
          fi
      - if: steps.branch.outputs.skip != 'true'
        run: git diff --exit-code

  lint-markdown:
    name: lint / markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix shell --inputs-from . nixpkgs#markdownlint-cli2 -c make lint-markdown

  lint-shellcheck:
    name: lint / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-shellcheck

  lint-vex:
    name: lint / vex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-vex

  test-msrv:
    name: test / msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --lib

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate code coverage
        run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: test / integration / ${{ matrix.cri_runtime }} / ${{ matrix.oci_runtime }} / ${{ matrix.mode }}${{ matrix.rootless && ' / rootless' || '' }}${{ matrix.nri && ' / nri' || '' }}${{ matrix.arch == 'aarch64' && ' / aarch64' || '' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: build-static
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        cri_runtime: [crio, containerd]
        oci_runtime: [crun, runc]
        mode: [single, multi]
        rootless: [false, true]
        include:
          - mode: single
            nodes: 1
          - mode: multi
            nodes: 2
          # Failed starts: a port conflict has to be refused before the
          # system changes, and an abort after the system setup must not
          # leave anything behind. The listener on the etcd port only
          # conflicts in root mode, rootless clusters have their own
          # network namespace.
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: crun
            mode: single
            rootless: false
            failed_start: true
          # NRI on existing legs, for both CRI runtimes in multinode root
          # mode, where they run in the node containers, and in rootless mode
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: crun
            mode: multi
            rootless: false
            nri: true
          - arch: x86_64
            cri_runtime: containerd
            oci_runtime: runc
            mode: multi
            rootless: false
            nri: true
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: runc
            mode: single
            rootless: true
            nri: true
          - arch: x86_64
            cri_runtime: containerd
            oci_runtime: crun
            mode: multi
            rootless: true
            nri: true
          # Variants of single options, named by their mode
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: crun
            mode: 3-nodes
            nodes: 3
            rootless: false
          - arch: x86_64
            cri_runtime: containerd
            oci_runtime: crun
            mode: cidr
            nodes: 1
            rootless: false
            cidr: 172.30.0.0/20
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: runc
            mode: addons-none
            nodes: 1
            rootless: true
            addons: none
          - arch: x86_64
            cri_runtime: containerd
            oci_runtime: runc
            mode: json-logs
            nodes: 1
            rootless: true
            log_format: json
          - arch: x86_64
            cri_runtime: crio
            oci_runtime: crun
            mode: long-root
            nodes: 1
            rootless: false
            long_root: true
          # Smoke test a small subset on aarch64
          - arch: aarch64
            cri_runtime: crio
            oci_runtime: crun
            mode: single
            nodes: 1
            rootless: false
          - arch: aarch64
            cri_runtime: crio
            oci_runtime: crun
            mode: single
            nodes: 1
            rootless: true
          - arch: aarch64
            cri_runtime: containerd
            oci_runtime: crun
            mode: single
            nodes: 1
            rootless: false
    env:
      NODES: ${{ matrix.nodes }}
      CRI_RUNTIME: ${{ matrix.cri_runtime }}
      OCI_RUNTIME: ${{ matrix.oci_runtime }}
      CIDR: ${{ matrix.cidr || '10.10.0.0/16' }}
      ADDONS: ${{ matrix.addons || 'coredns' }}
      LOG_FORMAT: ${{ matrix.log_format || 'text' }}
      ROOTLESS: ${{ matrix.rootless }}
      NRI: ${{ matrix.nri || false }}
      # Used by the scripts to read the state of a root cluster
      SUDO: ${{ !matrix.rootless && 'sudo' || '' }}
      CHECK_CONTAINERS: ${{ !matrix.rootless && matrix.nodes > 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubernix-${{ matrix.arch }}
      - run: chmod +x kubernix
      - name: Set the run root
        env:
          LONG_ROOT: ${{ matrix.long_root || false }}
        run: |
          root=$PWD/kubernix-run
          if [ "$LONG_ROOT" = true ]; then
            # The kubelet sockets below <root>/kubelet/test/run fit into the
            # 107 bytes of unix socket paths up to a root of 66 bytes.
            root=$(printf '%s/long-root-%s' "$PWD" "$(printf 'x%.0s' $(seq 64))" | cut -c1-64)
          fi
          echo "Using the run root $root"
          echo "KUBERNIX_ROOT=$root" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$root/kubeconfig/admin.kubeconfig" >> "$GITHUB_ENV"
      # The nri-logger sample plugin, which registers from the host in the
      # integration test, built with the Go of the pinned nixpkgs
      - name: Build the NRI plugin
        if: ${{ matrix.nri }}
        env:
          NRI_COMMIT: 5df40b41f7a269412ea74505265b9142c4d4ecb5 # v0.12.5
        run: |
          git init -q "$RUNNER_TEMP/nri"
          git -C "$RUNNER_TEMP/nri" fetch -q --depth 1 https://github.com/containerd/nri "$NRI_COMMIT"
          git -C "$RUNNER_TEMP/nri" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/nri/plugins/logger" &&
            nix shell --inputs-from "$GITHUB_WORKSPACE" nixpkgs#go -c env CGO_ENABLED=0 go build -o "$RUNNER_TEMP/nri-logger" .)
          echo "NRI_PLUGIN=$RUNNER_TEMP/nri-logger" >> "$GITHUB_ENV"
      - name: Set hostname
        if: ${{ !matrix.rootless }}
        run: |
          echo "127.0.0.1 test" | sudo tee -a /etc/hosts
          sudo hostnamectl set-hostname test
      - name: Prepare the system
        if: ${{ !matrix.rootless }}
        run: sudo contrib/prepare-system
      - name: Prepare rootless environment
        if: ${{ matrix.rootless }}
        run: |
          sudo sh -c 'echo "kernel.unprivileged_userns_clone=1" > /etc/sysctl.d/rootless.conf && sysctl --system'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo systemctl disable --now apparmor || true
          sudo sh -c 'mkdir -p /etc/systemd/system/user-.slice.d && printf "[Slice]\nDelegate=yes\n" > /etc/systemd/system/user-.slice.d/delegate.conf && systemctl daemon-reload'
      # The time budget: up to 10 minutes for the start, 14 for the checks,
      # 2 for their cleanup and 3 for the stop.
      - name: Run integration test
        id: integration
        env:
          TEST_TIMEOUT: 840
        run: |
          if [ "$ROOTLESS" = true ]; then AS_ROOT=(); else AS_ROOT=(sudo -E env "PATH=$PATH"); fi
          NRI_ARGS=()
          if [ "$NRI" = true ]; then NRI_ARGS=(--nri); fi
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" --log-level=debug --log-format="$LOG_FORMAT" \
            --no-shell --nodes="$NODES" --cri-runtime="$CRI_RUNTIME" --oci-runtime="$OCI_RUNTIME" \
            --cidr="$CIDR" --addons="$ADDONS" "${NRI_ARGS[@]}" > >(tee "$RUNNER_TEMP/kubernix.log") 2>&1 &
          KUBERNIX_PID=$!
          # In root mode this is the PID of sudo, which an unprivileged
          # kill -0 cannot probe, so check /proc instead.
          until [ -f "$KUBERNIX_ROOT/kubernix.pid" ]; do
            if [ ! -d "/proc/$KUBERNIX_PID" ]; then
              rc=0
              wait "$KUBERNIX_PID" || rc=$?
              echo "::error::kubernix exited with $rc before the cluster came up"
              exit 1
            fi
            if [ "$SECONDS" -ge 600 ]; then
              echo "::error::Timed out waiting for the cluster to come up"
              exit 1
            fi
            sleep 1
          done
          echo "Cluster is up, running checks"
          contrib/integration-test "$NODES" "$CRI_RUNTIME" "$OCI_RUNTIME"
          # $KUBERNIX_PID is the outermost process (sudo or the rootless
          # wrapper chain), kubernix stop signals the kubernix process itself.
          rc=0
          $SUDO ./kubernix --root="$KUBERNIX_ROOT" stop || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::kubernix stop exited with $rc"
            exit 1
          fi
          rc=0
          wait "$KUBERNIX_PID" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::kubernix exited with $rc after kubernix stop"
            exit 1
          fi
          if [ "$LOG_FORMAT" = json ]; then
            # Nix and rootlesskit write to the same output, so only the log
            # lines of kubernix have to be JSON.
            text=$(grep -E '^\[(ERROR|WARN |INFO |DEBUG|TRACE)\]' "$RUNNER_TEMP/kubernix.log" || true)
            if [ -n "$text" ]; then
              echo "::error::Text log lines with --log-format=json"
              echo "$text"
              exit 1
            fi
            json=$(jq -cR 'fromjson? | select(type == "object" and (.level | type) == "string"
              and (.message | type) == "string" and (.target | type) == "string")' "$RUNNER_TEMP/kubernix.log")
            if ! jq -se 'any(.[]; .level == "info") and any(.[]; .level == "debug")' <<<"$json" >/dev/null; then
              echo "::error::No JSON log lines of kubernix found"
              exit 1
            fi
            echo "Found $(wc -l <<<"$json") JSON log lines"
          fi
        timeout-minutes: 30
      - name: Check for leftovers after kubernix stop
        run: contrib/check-leftovers
      # The time budget: up to 5 minutes for the start, 8 for the checks,
      # 4 for their cleanup and 3 for the stop.
      - name: Restart the cluster
        id: restart
        env:
          TEST_PHASE: restart
          TEST_TIMEOUT: 480
        run: |
          if [ "$ROOTLESS" = true ]; then AS_ROOT=(); else AS_ROOT=(sudo -E env "PATH=$PATH"); fi
          # Reuse the stored configuration of the run directory
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" --log-level=debug --no-shell &
          KUBERNIX_PID=$!
          until [ -f "$KUBERNIX_ROOT/kubernix.pid" ]; do
            if [ ! -d "/proc/$KUBERNIX_PID" ]; then
              rc=0
              wait "$KUBERNIX_PID" || rc=$?
              echo "::error::kubernix exited with $rc before the cluster came up again"
              exit 1
            fi
            if [ "$SECONDS" -ge 300 ]; then
              echo "::error::Timed out waiting for the cluster to come up again"
              exit 1
            fi
            sleep 1
          done
          echo "Cluster is up again, running checks"
          # Checks the workload created before the restart
          contrib/integration-test "$NODES" "$CRI_RUNTIME" "$OCI_RUNTIME"
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" status
          status=$("${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" status --output json)
          echo "$status"
          if ! jq -e --argjson nodes "$NODES" --argjson nri "$NRI" \
            '.state == "running" and .nodes == $nodes and .nri == $nri and (.["node-status"] | length) == $nodes and all(.["node-status"][]; .ready)' \
            <<<"$status" >/dev/null; then
            echo "::error::Unexpected kubernix status"
            exit 1
          fi
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" shell -- kubectl get nodes
          rc=0
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" shell -- sh -c 'exit 42' || rc=$?
          if [ "$rc" -ne 42 ]; then
            echo "::error::kubernix shell exited with $rc instead of the exit code 42 of the command"
            exit 1
          fi
          # Stop with SIGINT like Ctrl+C does, the leftover check follows
          pid=$(cat "$KUBERNIX_ROOT/kubernix.pid")
          $SUDO kill -INT "$pid"
          deadline=$((SECONDS + 180))
          while [ -d "/proc/$KUBERNIX_PID" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::kubernix did not exit within 180s after SIGINT"
              exit 1
            fi
            sleep 1
          done
          rc=0
          wait "$KUBERNIX_PID" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::kubernix exited with $rc after SIGINT"
            exit 1
          fi
        timeout-minutes: 25
      - name: Check for leftovers after SIGINT
        run: contrib/check-leftovers
      - name: Refuse a start with a port conflict
        if: ${{ matrix.failed_start }}
        run: |
          # The sysctls which the system setup saves and restores, taken from
          # SYSCTLS in src/hoststate.rs, and the ones it enables
          mapfile -t sysctls < <(sed -n '/^const SYSCTLS/,/^];/p' src/hoststate.rs |
            sed -nE 's/^ *\(?"([a-z0-9_.-]+)".*/\1/p')
          if [ "${#sysctls[@]}" -eq 0 ]; then
            echo "::error::Unable to read the sysctls of src/hoststate.rs"
            exit 1
          fi
          sysctls+=(net.ipv4.ip_forward)
          # The host state which kubernix changes during the system setup
          snapshot() {
            cat /etc/hosts
            ip -o link show | awk '{print $2}'
            ip -o addr show | awk '{print $2, $4}'
            ip route show
            sudo iptables-save | grep -v '^[#:]'
            for key in "${sysctls[@]}"; do
              echo "$key = $(sysctl -n "$key" 2>/dev/null || echo missing)"
            done
            sudo cat /run/kubernix-host-state 2>/dev/null || true
          }
          # Occupy the etcd client port, kubernix has to refuse the start
          # before it changes the system
          python3 -m http.server --bind 127.0.0.1 2379 >/dev/null 2>&1 &
          LISTENER=$!
          trap 'kill "$LISTENER"' EXIT
          timeout 30 bash -c 'until nc -z 127.0.0.1 2379; do sleep 1; done'
          before=$(snapshot)
          rc=0
          timeout 600 sudo -E env "PATH=$PATH" ./kubernix --root="$KUBERNIX_ROOT" --log-level=debug --no-shell \
            > "$RUNNER_TEMP/port-conflict.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/port-conflict.log"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "::error::kubernix exited with $rc despite the port conflict"
            exit 1
          fi
          if ! grep -q 'Port 2379 of etcd is already in use' "$RUNNER_TEMP/port-conflict.log"; then
            echo "::error::kubernix did not refuse the start because of the port conflict"
            exit 1
          fi
          if ! diff -u <(echo "$before") <(snapshot); then
            echo "::error::kubernix changed the system before refusing the start"
            exit 1
          fi
          # A setup which got restored afterwards leaves the same state, but
          # logs the kernel modules and sysctls (System::setup) and the
          # restore of the host state at debug level
          setup=$(grep -iE "kernel module '|sysctl '|skipping modprobe|host state" "$RUNNER_TEMP/port-conflict.log" || true)
          if [ -n "$setup" ]; then
            echo "::error::kubernix ran the system setup before refusing the start"
            echo "$setup"
            exit 1
          fi
          echo "kubernix refused the start with $rc as expected"
        timeout-minutes: 15
      - name: Check for leftovers after the refused start
        if: ${{ matrix.failed_start }}
        run: contrib/check-leftovers
      - name: Abort the start after the system setup
        if: ${{ matrix.failed_start }}
        run: |
          # The log belongs to the runner user
          AS_ROOT=(sudo -E env "PATH=$PATH")
          "${AS_ROOT[@]}" ./kubernix --root="$KUBERNIX_ROOT" --log-level=debug --no-shell \
            > "$RUNNER_TEMP/abort.log" 2>&1 &
          KUBERNIX_PID=$!
          trap 'tail -n 300 "$RUNNER_TEMP/abort.log"' EXIT
          # The API server starts after the system setup, the bridges, the
          # PKI and the NAT exemption, and before the CRI runtime and the
          # kubelet.
          until grep -q 'API Server is ready' "$RUNNER_TEMP/abort.log"; do
            if [ ! -d "/proc/$KUBERNIX_PID" ]; then
              echo "::error::kubernix exited before it could be aborted"
              exit 1
            fi
            if [ "$SECONDS" -ge 600 ]; then
              echo "::error::Timed out waiting for the API server"
              exit 1
            fi
            sleep 0.2
          done
          # The PID file only exists once the cluster is up, kubernix status
          # shows the PID of a starting instance from the lock file. Right
          # after taking the lock, it still contains the PID of the former
          # instance, so read it only now and check that it is kubernix.
          if ! status=$(sudo ./kubernix --root="$KUBERNIX_ROOT" status --output json); then
            echo "::error::kubernix status failed for the starting cluster"
            exit 1
          fi
          echo "$status"
          pid=$(jq -r '.pid // empty' <<<"$status")
          if [ -z "$pid" ]; then
            echo "::error::kubernix status shows no PID"
            exit 1
          fi
          exe=$(sudo readlink "/proc/$pid/exe" || true)
          if [ "${exe##*/}" != kubernix ]; then
            echo "::error::PID $pid belongs to '$exe' instead of kubernix"
            exit 1
          fi
          echo "Sending SIGTERM to kubernix (PID $pid)"
          sudo kill -TERM "$pid"
          deadline=$((SECONDS + 180))
          while [ -d "/proc/$KUBERNIX_PID" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::kubernix did not exit within 180s after SIGTERM"
              exit 1
            fi
            sleep 1
          done
          rc=0
          wait "$KUBERNIX_PID" || rc=$?
          echo "kubernix exited with $rc after SIGTERM"
          # An aborted bootstrap exits with 1, a cluster which came up before
          # the signal with 0 (see the exit codes in docs/stability.md). Anything
          # else, like 101 of a panic, is a failure.
          if grep -q 'Everything is up and running' "$RUNNER_TEMP/abort.log"; then
            echo "::warning::The cluster came up before the abort"
            expected=0
          else
            expected=1
          fi
          if [ "$rc" -ne "$expected" ]; then
            echo "::error::kubernix exited with $rc instead of $expected after SIGTERM"
            exit 1
          fi
        timeout-minutes: 15
      - name: Check for leftovers after the aborted start
        if: ${{ matrix.failed_start }}
        run: contrib/check-leftovers
      - name: Dump logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          for f in $(sudo find "$KUBERNIX_ROOT" -name '*.log' -type f \( -path '*/crio/*' -o -path '*/containerd/*' -o -path '*/kubelet/*' \) -not -path '*/containers/*' -not -path '*/root/*' -not -path '*/state/*' | sort); do
            echo "::group::$f"
            sudo tail -n 1000 "$f" || true
            echo "::endgroup::"
          done
          echo "::group::kubectl get pods"
          timeout 30 kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::kubectl logs coredns"
          timeout 30 kubectl logs -n kube-system -l k8s-app=coredns --all-containers --previous || true
          timeout 30 kubectl logs -n kube-system -l k8s-app=coredns --all-containers || true
          echo "::endgroup::"
          echo "::group::sockets of the CoreDNS ports"
          sudo ss -tulpn | grep -E ':(53|9153|10053|10054|10055)\s' || true
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          timeout 30 kubectl describe pods -A || true
          echo "::endgroup::"
          echo "::group::kubectl get events"
          timeout 30 kubectl get events -A --sort-by=.lastTimestamp || true
          echo "::endgroup::"
