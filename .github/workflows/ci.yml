name: ci
on:
  pull_request: {}
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single required check which gates releases and fails unless every other
  # check succeeded.
  all-checks:
    name: all checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - build-static
      - docs
      - lint-audit
      - lint-clippy
      - lint-deny
      - lint-dependencies
      - lint-readme-versions
      - lint-rustfmt
      - lint-shellcheck
      - lint-vex
      - test-integration
      - test-msrv
      - test-unit
    steps:
      - name: Check the results of all needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  build:
    name: build / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            make_target: build
            cache_suffix: ""
          - profile: release
            make_target: build-release
            cache_suffix: "-release"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo${{ matrix.cache_suffix }}-${{ hashFiles('**/Cargo.lock') }}
      - run: make ${{ matrix.make_target }}

  # Native builds on both architectures, since cargo auditable does not work
  # with cross. The embedded dependency list is the source of the release SBOMs.
  build-static:
    name: build / static / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable@0.7.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - run: make build-static STATIC_TARGET=${{ matrix.target }} STATIC_CARGO="cargo auditable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernix-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/kubernix

  deploy:
    name: deploy / release
    runs-on: ubuntu-latest
    needs: all-checks
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kubernix-*
          path: artifacts
      - name: Prepare release binaries
        run: |
          mkdir -p release
          for arch in x86_64 aarch64; do
            cp "artifacts/kubernix-$arch/kubernix" "release/kubernix-$arch"
          done
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0
      # The SBOMs list the dependencies embedded by cargo auditable, so only
      # what is linked into each binary. The SPDX version is pinned to keep the
      # attestation predicate type stable.
      - name: Generate SBOMs
        working-directory: release
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for arch in x86_64 aarch64; do
            "$SYFT" scan "file:kubernix-$arch" -o "spdx-json@2.3=kubernix-$arch.spdx.json"
            jq -e 'any(.packages[].externalRefs[]?; .referenceLocator | startswith("pkg:cargo/kubernix@"))' \
              "kubernix-$arch.spdx.json" >/dev/null
          done
      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum kubernix-x86_64 kubernix-aarch64 \
            kubernix-x86_64.spdx.json kubernix-aarch64.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # SHA256SUMS covers all other assets, so a single signature is enough.
      - name: Sign checksums
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/kubernix-x86_64
            release/kubernix-aarch64
            release/kubernix-x86_64.spdx.json
            release/kubernix-aarch64.spdx.json
            release/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/kubernix-x86_64
          sbom-path: release/kubernix-x86_64.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/kubernix-aarch64
          sbom-path: release/kubernix-aarch64.spdx.json
      - name: Upload release binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*

  docs:
    name: docs / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - run: make docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: target/doc

  docs-publish:
    name: docs / publish
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: doc
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc

  lint-clippy:
    name: lint / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: make lint-clippy

  lint-rustfmt:
    name: lint / rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt
      - run: make lint-rustfmt

  lint-audit:
    name: lint / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: make lint-audit

  lint-deny:
    name: lint / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  lint-dependencies:
    name: lint / dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-dependencies

  # The nixpkgs bumps of dependabot do not regenerate the table, so it gets
  # committed to their pull requests instead.
  lint-readme-versions:
    name: lint / readme versions
    runs-on: ubuntu-latest
    env:
      COMMIT_README: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/nix/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_README == 'true' && github.head_ref || '' }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: make update-readme
      - if: env.COMMIT_README == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git commit -m "Update the README versions" README.md
            git push
          fi
      - run: git diff --exit-code README.md

  lint-shellcheck:
    name: lint / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-shellcheck

  lint-vex:
    name: lint / vex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-vex

  test-msrv:
    name: test / msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cfssl
        run: contrib/install-cfssl
      - run: cargo test --lib

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cfssl
        run: contrib/install-cfssl
      - name: Generate code coverage
        run: cargo llvm-cov --lib --lcov --output-path lcov.info
      - name: Upload Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: test / integration / ${{ matrix.cri_runtime }} / ${{ matrix.oci_runtime }} / ${{ matrix.mode }}${{ matrix.rootless && ' / rootless' || '' }}${{ matrix.arch == 'aarch64' && ' / aarch64' || '' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: build-static
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        cri_runtime: [crio, containerd]
        oci_runtime: [crun, runc]
        mode: [single, multi]
        rootless: [false, true]
        include:
          - mode: single
            nodes: 1
          - mode: multi
            nodes: 2
          # Smoke test a small subset on aarch64
          - arch: aarch64
            cri_runtime: crio
            oci_runtime: crun
            mode: single
            nodes: 1
            rootless: false
          - arch: aarch64
            cri_runtime: crio
            oci_runtime: crun
            mode: single
            nodes: 1
            rootless: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubernix-${{ matrix.arch }}
      - run: chmod +x kubernix
      - name: Set hostname
        if: ${{ !matrix.rootless }}
        run: |
          echo "127.0.0.1 test" | sudo tee -a /etc/hosts
          sudo hostnamectl set-hostname test
      - name: Free port 53 for CoreDNS
        if: ${{ !matrix.rootless }}
        run: |
          echo 'nameserver 8.8.8.8' | sudo tee /etc/resolv.conf
          sudo systemctl stop systemd-resolved || true
      - name: Prepare the system
        if: ${{ !matrix.rootless }}
        run: sudo contrib/prepare-system
      - name: Prepare rootless environment
        if: ${{ matrix.rootless }}
        run: |
          sudo sh -c 'echo "kernel.unprivileged_userns_clone=1" > /etc/sysctl.d/rootless.conf && sysctl --system'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo systemctl disable --now apparmor || true
          sudo sh -c 'mkdir -p /etc/systemd/system/user-.slice.d && printf "[Slice]\nDelegate=yes\n" > /etc/systemd/system/user-.slice.d/delegate.conf && systemctl daemon-reload'
      - name: Run integration test
        id: integration
        env:
          SUDO: ${{ !matrix.rootless && 'sudo' || '' }}
        run: |
          ${{ !matrix.rootless && 'sudo -E env "PATH=$PATH"' || '' }} ./kubernix --log-level=debug --no-shell --nodes=${{ matrix.nodes }} --cri-runtime=${{ matrix.cri_runtime }} --oci-runtime=${{ matrix.oci_runtime }} &
          KUBERNIX_PID=$!
          # In root mode this is the PID of sudo, which an unprivileged
          # kill -0 cannot probe, so check /proc instead.
          until [ -f kubernix-run/kubernix.pid ]; do
            if [ ! -d "/proc/$KUBERNIX_PID" ]; then
              rc=0
              wait "$KUBERNIX_PID" || rc=$?
              echo "::error::kubernix exited with $rc before the cluster came up"
              exit 1
            fi
            if [ "$SECONDS" -ge 600 ]; then
              echo "::error::Timed out waiting for the cluster to come up"
              exit 1
            fi
            sleep 1
          done
          echo "Cluster is up, running checks"
          export KUBECONFIG=$PWD/kubernix-run/kubeconfig/admin.kubeconfig
          contrib/integration-test ${{ matrix.nodes }} ${{ matrix.cri_runtime }} ${{ matrix.oci_runtime }}
          # $KUBERNIX_PID is the outermost process (sudo or the rootless
          # wrapper chain), so signal the kubernix process itself.
          $SUDO kill "$($SUDO cat kubernix-run/kubernix.pid)"
          wait "$KUBERNIX_PID" || true
        timeout-minutes: 15
      - name: Dump logs on failure
        if: ${{ always() && steps.integration.outcome != 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export KUBECONFIG=$PWD/kubernix-run/kubeconfig/admin.kubeconfig
          for f in $(sudo find kubernix-run -name '*.log' -type f \( -path '*/crio/*' -o -path '*/containerd/*' -o -path '*/kubelet/*' \) -not -path '*/containers/*' -not -path '*/root/*' -not -path '*/state/*' | sort); do
            echo "::group::$f"
            sudo tail -n 1000 "$f" || true
            echo "::endgroup::"
          done
          echo "::group::kubectl get pods"
          timeout 30 kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::kubectl describe pods -n kube-system"
          timeout 30 kubectl describe pods -n kube-system || true
          timeout 30 kubectl describe pods -n default || true
          echo "::endgroup::"
          echo "::group::kubectl get events"
          timeout 30 kubectl get events -A --sort-by=.lastTimestamp || true
          echo "::endgroup::"
