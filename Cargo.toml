[package]
name = "kubernix"
version = "1.0.0"
authors = ["Sascha Grunert <mail@saschagrunert.de>"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
categories = ["command-line-utilities", "development-tools"]
description = "Kubernetes development cluster bootstrapping with Nix packages"
documentation = "https://docs.rs/kubernix"
homepage = "https://github.com/saschagrunert/kubernix"
keywords = ["kubernetes", "nix", "cluster", "cri-o", "containerd"]
readme = "README.md"
repository = "https://github.com/saschagrunert/kubernix"

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.0"
clap = { version = "4.6.1", features = ["derive", "wrap_help", "env", "color"] }
console = "0.16.3"
getrandom = "0.4.3"
indicatif = "0.18.4"
ipnetwork = { version = "0.21.1", features = ["serde"] }
log = { version = "0.4.32", features = ["serde", "std"] }
nix = { version = "0.31.3", features = ["fs", "hostname", "signal", "mount", "process", "sched", "user"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"
toml = "1.1.2"

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"

[profile.release]
strip = true
